<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Checkout cancelled · tryoncam</title>
<link rel="icon" href="./logo-mark.svg" type="image/svg+xml">
<style>
  :root { --bg: #f5f6f8; --card: #fff; --text: #16181d; --muted: #5d6470; --border: #e3e6eb; --accent: #3d5bf5; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg: #0f1115; --card: #171a20; --text: #eef0f4; --muted: #9aa1ad; --border: #2a2f38; --accent: #6f86ff; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px;
         background: var(--bg); color: var(--text);
         font: 15px/1.6 ui-sans-serif, -apple-system, "Segoe UI", system-ui, sans-serif; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 18px; padding: 34px 30px;
          max-width: 420px; width: 100%; text-align: center; display: grid; gap: 12px; justify-items: center; }
  img { width: 52px; height: 52px; }
  h1 { margin: 4px 0 0; font-size: 21px; letter-spacing: -.02em; }
  p { margin: 0; color: var(--muted); }
  .tick { width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center;
          background: color-mix(in srgb, #8a93a3 16%, transparent); color: #8a93a3; font-size: 22px; font-weight: 700; }
</style>
</head>
<body>
  <main class="card">
    <img src="./logo-mark.svg" alt="tryoncam">
    <div class="tick" aria-hidden="true">×</div>
    <h1>Checkout cancelled</h1>
    <p>Nothing was charged. Your existing credits are untouched.</p>
    <p>You can close this tab and go back to the store you were on.</p>
  </main>
</body>
</html>
